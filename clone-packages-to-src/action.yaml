name: clone-packages-to-src
description: Clone packages to src directory

inputs:
  token:
    description: GitHub Token
    required: false
    default: ${{ github.token }}
  repos-file:
    description: Path of .repos file
    required: false
    default: "*.repos"

runs:
  using: docker
  image: Dockerfile
  env:
    INPUT_TOKEN: ${{ inputs.token }}
    INPUT_REPOS_FILE: ${{ inputs.repos-file }}

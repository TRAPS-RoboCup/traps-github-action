name: docker-build-ros2-pkg
description: Build Docker Image for ROS2 package and push to ghcr.io

inputs:
  target:
    description: >-
      The target stage to build.
    required: false
    default: executor
  push:
    description: >-
      Whether to push the built image to the registry.
    required: false
    default: true
  token:
    description: >-
      GitHub Token with permissions to push to the registry.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
  - name: Login to GitHub Container Registry
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ inputs.token }}
      logout: false

  - name: Extract metadata (tags, labels) for Docker
    if : ${{ inputs.target != 'executor' }}
    id: set-docker-metadata
    uses: docker/metadata-action@v5
    with:
      images: ghcr.io/${{ github.repository }}/${{ inputs.target }}
  
  - name: Extract metadata (tags, labels) for Docker (executor)
    if : ${{ inputs.target == 'executor' }}
    id: set-docker-metadata-executor
    uses: docker/metadata-action@v5
    with:
      images: |
        ghcr.io/${{ github.repository }}/executor
        ghcr.io/${{ github.repository }}

  - name: Build and push (${{ inputs.target }})
    uses: docker/build-push-action@v5
    with:
      target: ${{ inputs.target }}
      context: ${{ github.workspace }}
      file: ${{ github.action_path }}/Dockerfile
      push: ${{ inputs.push }}
      tags: ${{ inputs.target == 'executor' && steps.set-docker-metadata-executor.outputs.tags || steps.set-docker-metadata.outputs.tags }}
      labels: ${{ inputs.target == 'executor' && steps.set-docker-metadata-executor.outputs.labels || steps.set-docker-metadata.outputs.labels }}
      cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:${{ github.ref }}
      cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:${{ github.ref }},mode=max

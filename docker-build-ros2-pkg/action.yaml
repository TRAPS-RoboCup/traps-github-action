name: docker-build-ros2-pkg
description: Build Docker Image for ROS2 package and push to ghcr.io

inputs:
  target:
    description: >-
      The target stage to build.
    required: false
    default: executor
  platforms:
    description: >-
      Target platforms to build (comma or newline separated). Leave empty for native.
    required: false
    default: ""
  tag_suffix:
    description: >-
      Suffix to append to all tags (e.g. -amd64, -arm64).
    required: false
    default: ""
  push:
    description: >-
      Whether to push the built image to the registry.
    required: false
    default: true
  token:
    description: >-
      GitHub Token with permissions to push to the registry.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
  - name: Login to GitHub Container Registry
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ inputs.token }}
      logout: false

  - name: Normalize environment variables
    shell: bash
    run: |
      echo "repository_lowercase=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      ref_name="${{ github.ref }}"
      ref_name="${ref_name//\//-}"
      echo "ref_sanitized=$ref_name" >> "$GITHUB_ENV"

  - name: Extract metadata (tags, labels) for Docker
    if : ${{ inputs.target != 'executor' }}
    id: set-docker-metadata
    uses: docker/metadata-action@v5
    with:
      images: ghcr.io/${{ env.repository_lowercase }}/${{ inputs.target }}
      flavor: |
        suffix=${{ inputs.tag_suffix }}

  - name: Extract metadata (tags, labels) for Docker (executor)
    if : ${{ inputs.target == 'executor' }}
    id: set-docker-metadata-executor
    uses: docker/metadata-action@v5
    with:
      images: |
        ghcr.io/${{ env.repository_lowercase }}/executor
        ghcr.io/${{ env.repository_lowercase }}
      flavor: |
        suffix=${{ inputs.tag_suffix }}

  - name: Set up Docker Buildx
    id: set-docker-builder
    uses: docker/setup-buildx-action@v3

  - name: Build and push (${{ inputs.target }})
    uses: docker/build-push-action@v5
    with:
      target: ${{ inputs.target }}
      context: ${{ github.workspace }}
      file: ${{ github.action_path }}/Dockerfile
      builder: ${{ steps.set-docker-builder.outputs.name }}
      push: ${{ inputs.push }}
      tags: ${{ inputs.target == 'executor' && steps.set-docker-metadata-executor.outputs.tags || steps.set-docker-metadata.outputs.tags }}
      labels: ${{ inputs.target == 'executor' && steps.set-docker-metadata-executor.outputs.labels || steps.set-docker-metadata.outputs.labels }}
      platforms: ${{ inputs.platforms }}
      cache-from: type=gha,ref=ghcr.io/${{ env.repository_lowercase }}/buildcache:${{ env.ref_sanitized }}${{ inputs.tag_suffix }}
      cache-to: type=gha,ref=ghcr.io/${{ env.repository_lowercase }}/buildcache:${{ env.ref_sanitized }}${{ inputs.tag_suffix }},mode=max

name: add-ros2-docker-ignore
description: Add .dockerignore file to reduce Docker image size by excluding unnecessary files and directories.

inputs:
  working-directory:
    description: Path to the ROS2 workspace (relative to the repository root).
    required: false
    default: "${{ github.workspace }}"

runs:
  using: composite
  steps:
  - name: Compute cache parameters
    shell: bash
    working-directory: ${{ inputs.working-directory }}
    run: |
      echo doc >> .dockerignore
      echo ".*" >> .dockerignore
      echo README.md >> .dockerignore
